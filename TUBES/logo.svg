<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Logo SXIO Restoran" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="340">
      <stop offset="0" stop-color="#FFEDB3"/>
      <stop offset="0.5" stop-color="#F5C453"/>
      <stop offset="1" stop-color="#B9822A"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1c2f22"/>
      <stop offset="1" stop-color="#070d09"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Badge -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)" fill-opacity="0.92" stroke="url(#gold)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="200" cy="200" r="174" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>

  <!-- Ikon sendok garpu -->
  <g fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 80 L178 98 Q178 106 185 106 Q192 106 192 98 L192 80 M185 80 L185 106 M185 106 L185 135"/>
    <ellipse cx="217" cy="93" rx="8" ry="13"/>
    <path d="M217 106 L217 135"/>
  </g>

  <!-- Huruf SXIO -->
  <g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M131 178 C126 168, 114 165, 108 165 C94 165, 87 173, 87 182 C87 204, 133 200, 133 224 C133 236, 124 245, 110 245 C96 245, 88 238, 85 229"/>
    <path d="M159 165 L215 245 M215 165 L159 245"/>
    <path d="M239 165 L239 245"/>
    <ellipse cx="289" cy="205" rx="26" ry="40"/>
  </g>

  <!-- Pembatas -->
  <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="278" x2="186" y2="278"/>
    <line x1="214" y1="278" x2="280" y2="278"/>
  </g>
  <rect x="195" y="273" width="10" height="10" fill="url(#gold)" transform="rotate(45 200 278)"/>

  <!-- Tulisan -->
  <text x="204" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" letter-spacing="9" fill="#FFF3CF">RESTORAN</text>
  <text x="200" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="8" fill="url(#gold)">★ ★ ★</text>
</svg>
